<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>imood.ai — 情緒虛擬人對話 Demo</title>
<style>
  :root{
    --bg-deep: #0B1220;
    --bg-panel: #111B2E;
    --bg-panel-2: #16223A;
    --line: #22314D;
    --text-hi: #EDF1F7;
    --text-mid: #9AA9C2;
    --text-dim: #5C6C87;
    --accent: #E8A33D;
    --accent-dim: #4A3A1E;
    --joy: #E8A33D;
    --anger: #D2564F;
    --sorrow: #4E7FBF;
    --calm: #4FA383;
    --radius: 10px;
    --mono: "SFMono-Regular", "Consolas", "Menlo", monospace;
    --sans: -apple-system, "Segoe UI", "Noto Sans TC", "PingFang TC", sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg-deep);
    color:var(--text-hi);
    font-family:var(--sans);
    min-height:100vh;
  }
  .app{
    display:grid;
    grid-template-columns: 280px 1fr 380px;
    grid-template-rows: 56px 1fr;
    grid-template-areas:
      "header header header"
      "sidebar main transcript";
    height:100vh;
  }
  header{
    grid-area:header;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    border-bottom:1px solid var(--line);
    background:var(--bg-panel);
  }
  .brand{
    font-family:var(--mono);
    font-size:14px;
    letter-spacing:0.06em;
    color:var(--text-hi);
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand small{color:var(--text-dim); font-weight:400; font-size:12px;}
  .status-pill{
    font-family:var(--mono);
    font-size:11px;
    color:var(--calm);
    border:1px solid var(--calm);
    padding:3px 10px;
    border-radius:999px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .status-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--calm);}
  .status-pill.state-listening{color:var(--calm);border-color:var(--calm);}
  .status-pill.state-listening .dot{background:var(--calm);}
  .status-pill.state-busy{color:var(--accent);border-color:var(--accent);}
  .status-pill.state-busy .dot{background:var(--accent);animation:status-pulse 1s ease-in-out infinite;}
  @keyframes status-pulse{0%,100%{opacity:1;}50%{opacity:0.25;}}

  .sidebar{
    grid-area:sidebar;
    background:var(--bg-panel);
    border-right:1px solid var(--line);
    padding:18px 14px;
    overflow-y:auto;
  }
  .sidebar h3{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--text-dim);
    margin:0 0 10px;
    font-weight:500;
  }
  .session-item{
    padding:10px 12px;
    border-radius:var(--radius);
    font-size:13px;
    color:var(--text-mid);
    cursor:pointer;
    margin-bottom:4px;
  }
  .session-item.active{
    background:var(--bg-panel-2);
    color:var(--text-hi);
    border-left:2px solid var(--accent);
  }
  .sidebar-divider{height:1px; background:var(--line); margin:18px 0;}
  .input-mode{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .mode-option{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    color:var(--text-mid);
    padding:8px 10px;
    border-radius:8px;
    border:1px solid var(--line);
  }
  .mode-option.disabled{opacity:0.4;}
  .mode-option .tag{
    font-family:var(--mono);
    font-size:10px;
    color:var(--text-dim);
    margin-left:auto;
  }
  .mode-option .tag.on{ color:var(--calm); }
  .mic-btn{
    width:100%;
    margin-top:8px;
    background:var(--bg-panel-2);
    color:var(--text-hi);
    border:1px solid var(--line);
    border-radius:8px;
    padding:9px 10px;
    font-size:12px;
    font-family:var(--sans);
    cursor:pointer;
  }
  .mic-btn:hover{ border-color:var(--accent); }
  .mic-btn.recording{ border-color:var(--anger); color:var(--anger); }
  .mic-btn:disabled{ opacity:0.4; cursor:not-allowed; border-color:var(--line); }
  .mic-btn.playing{ border-color:var(--accent); color:var(--accent); }
  .mic-hint{
    margin-top:6px;
    font-size:10px;
    line-height:1.5;
    color:var(--text-dim);
  }
  .mic-hint code{
    font-family:var(--mono);
    font-size:10px;
    color:var(--text-mid);
  }
  .mic-meter{
    margin-top:8px;
    height:6px;
    border-radius:999px;
    background:var(--bg-deep);
    border:1px solid var(--line);
    overflow:hidden;
  }
  .mic-meter-bar{
    height:100%;
    width:0%;
    background:var(--calm);
    transition:width 0.08s linear;
  }

  main{
    grid-area:main;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:
      radial-gradient(circle at 50% 30%, rgba(232,163,61,0.05), transparent 60%),
      var(--bg-deep);
    position:relative;
  }
  .avatar-stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
  }
  .avatar-frame{
    /* 盡量填滿主欄位，取三者的最小值：
         900px          來源影片就是 900x900，再大只是放大糊掉
         100vh - 160px  扣掉 header(56)、main 的上下 padding(48)、
                        下方「換一張臉」與 badge(約 56)
         100vw - 720px  扣掉左側欄(280)、右側對話紀錄(380)、padding(48)
       —— 用 min() 讓視窗不論先碰到高度還是寬度的限制都不會爆版。 */
    width:min(900px, calc(100vh - 160px), calc(100vw - 720px));
    min-width:240px;
    aspect-ratio:1 / 1;
    /* 方形：來源影片是 900x900，圓形會裁掉約兩成（四個角、部分頭髮與肩膀） */
    border-radius:16px;
    background:var(--bg-panel);
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    transition:box-shadow 0.4s ease;
  }
  .avatar-frame.speaking{
    box-shadow: 0 0 0 6px var(--accent-dim);
  }
  /* 靜態照片與影片疊在同一個位置，同樣的裁切方式 —— 換過去時只有嘴會變，
     頭的位置與背景不會跳。 */
  #avatar-still, #avatar-video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border-radius:16px;
    object-fit:cover;
  }
  #avatar-video{ display:none; }
  .avatar-frame.video-active #avatar-video{ display:block; }
  .avatar-frame.video-active #avatar-still{ display:none; }

  .avatar-badge{
    position:absolute;
    bottom:-10px;
    left:50%;
    transform:translateX(-50%);
    white-space:nowrap;
    font-family:var(--mono);
    font-size:10px;
    color:var(--text-dim);
    background:var(--bg-panel-2);
    border:1px solid var(--line);
    border-radius:999px;
    padding:3px 10px;
    opacity:0;
    transition:opacity 0.25s ease;
  }
  .avatar-badge.on{ opacity:1; }

  /* --- 選臉 --- */
  .face-picker{
    display:flex;
    gap:20px;
    align-items:flex-end;
  }
  .face-card{
    background:none;
    border:none;
    padding:0;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    font-family:var(--sans);
  }
  .face-card .face-photo{
    /* 兩張並排，所以上限比對話中那張小；主欄位最窄的情況也塞得下 */
    width:clamp(150px, 34vh, 320px);
    aspect-ratio:1 / 1;
    border-radius:12px;
    overflow:hidden;
    border:2px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg-panel);
    transition:border-color 0.25s ease, transform 0.25s ease;
  }
  .face-card .face-photo img{ width:100%; height:100%; object-fit:cover; }
  .face-photo-empty{
    font-size:11px;
    color:var(--text-dim);
    text-align:center;
    line-height:1.5;
    padding:0 14px;
  }
  .face-card:hover:not(:disabled) .face-photo{ border-color:var(--accent); }
  .face-card.selected .face-photo{
    border-color:var(--accent);
    transform:scale(1.08);
  }
  .face-card .face-name{ font-size:13px; color:var(--text-mid); }
  .face-card.selected .face-name{ color:var(--text-hi); font-weight:600; }
  .face-card:disabled{ cursor:not-allowed; opacity:0.55; }

  .face-switch{
    background:none;
    border:none;
    color:var(--text-dim);
    font-family:var(--sans);
    font-size:11px;
    cursor:pointer;
    text-decoration:underline;
    display:none;
  }
  .face-switch:hover{ color:var(--text-mid); }

  /* 選定之後：收起選單、只留選中的那張大頭像 */
  .avatar-stage.picked .face-picker{ display:none; }
  .avatar-stage.picked .face-switch{ display:block; }
  .avatar-stage:not(.picked) .avatar-frame{ display:none; }

  .transcript{
    grid-area:transcript;
    background:var(--bg-panel);
    border-left:1px solid var(--line);
    display:flex;
    flex-direction:column;
  }
  .transcript-header{
    padding:14px 16px;
    border-bottom:1px solid var(--line);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--text-dim);
  }
  .transcript-body{
    flex:1;
    overflow-y:auto;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .msg{
    max-width:100%;
    font-size:13px;
    line-height:1.6;
    padding:10px 12px;
    border-radius:var(--radius);
  }
  .msg.user{
    background:var(--bg-panel-2);
    color:var(--text-hi);
    align-self:flex-end;
  }
  .msg.avatar{
    background:transparent;
    border:1px solid var(--line);
    color:var(--text-mid);
    align-self:flex-start;
  }
  .msg .tag{
    display:block;
    font-family:var(--mono);
    font-size:10px;
    color:var(--text-dim);
    margin-bottom:4px;
  }
  .composer{
    border-top:1px solid var(--line);
    background:var(--bg-panel);
    padding:14px 16px;
    display:flex;
    gap:8px;
  }
  .composer input{
    flex:1;
    background:var(--bg-deep);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px 14px;
    color:var(--text-hi);
    font-size:14px;
    font-family:var(--sans);
    outline:none;
  }
  .composer input:focus{border-color:var(--accent);}
  .composer button{
    background:var(--accent);
    color:var(--bg-deep);
    border:none;
    border-radius:var(--radius);
    padding:0 22px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    font-family:var(--sans);
  }
  .composer button:disabled{opacity:0.5; cursor:not-allowed;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">imood.ai <small>情緒虛擬人對話 demo</small></div>
    <div class="status-pill" id="status-pill"><span class="dot"></span><span id="status-text">文字輸入模式</span></div>
  </header>

  <aside class="sidebar">
    <h3>對話 Session</h3>
    <div class="session-item active">目前對話</div>
    <div class="session-item">＋ 新增 session</div>

    <div class="sidebar-divider"></div>

    <h3>輸入來源</h3>
    <div class="input-mode">
      <div class="mode-option">
        文字輸入 <span class="tag">啟用中</span>
      </div>
      <div class="mode-option" id="mic-option">
        語音輸入（voice-only） <span class="tag" id="mic-tag">尚未啟用</span>
      </div>
    </div>
    <button id="mic-btn" class="mic-btn">🎤 啟用語音輸入（voice-only）</button>
    <div class="mic-meter" id="mic-meter"><div class="mic-meter-bar" id="mic-meter-bar"></div></div>
    <button id="sample-btn" class="mic-btn">🔊 播放範例語音</button>
    <div class="mic-hint">demo 用：不需麥克風，走跟語音輸入一樣的 <code>/ws/audio</code> pipeline</div>

    <div class="sidebar-divider"></div>

    <h3>模型狀態</h3>
    <div class="input-mode">
      <div class="mode-option disabled">
        對話模型 <span class="tag">待選型</span>
      </div>
      <div class="mode-option disabled">
        情緒判別 <span class="tag">BERT 開發中</span>
      </div>
    </div>
  </aside>

  <main>
    <!--
      選臉 → 對話。選哪張臉就決定用哪個聲音，所以左側沒有另外的男女聲選項。

      對話過程中畫面上一直是那張「靜態照片」；JoyGen 把整句的嘴型算完之後，
      才把影片接在同一個位置播出來。照片用的就是影片的第一幀（見
      pipeline.yaml 的 still_frame），所以切換時頭部姿勢與背景是對齊的。

      情緒表情之後由 BERT 判斷驅動，原本那張 SVG 假臉已經拿掉。
    -->
    <div class="avatar-stage" id="avatar-stage">
      <div class="face-picker" id="face-picker">
        <button type="button" class="face-card selected" data-avatar="female">
          <span class="face-photo"><img src="demo-assets/face_female.jpg" alt="女生虛擬人"></span>
          <span class="face-name">女生</span>
        </button>
        <button type="button" class="face-card pending" data-avatar="male" disabled>
          <span class="face-photo face-photo-empty">人選確認中</span>
          <span class="face-name">男生</span>
        </button>
      </div>

      <div class="avatar-frame" id="avatar-frame">
        <img id="avatar-still" src="demo-assets/face_female.jpg" alt="虛擬人">
        <video id="avatar-video" playsinline></video>
        <div class="avatar-badge" id="avatar-badge"></div>
      </div>
      <button type="button" class="face-switch" id="face-switch">換一張臉</button>
    </div>
  </main>

  <aside class="transcript">
    <div class="transcript-header">對話紀錄</div>
    <div class="transcript-body" id="transcript-body">
      <div class="msg avatar"><span class="tag">avatar</span>嗨，我在這裡，輸入文字跟我聊聊吧。</div>
    </div>
    <div class="composer">
      <input type="text" id="text-input" placeholder="輸入訊息，按 Enter 送出…" autocomplete="off">
      <button id="send-btn">送出</button>
    </div>
  </aside>
</div>

<script>
// ============================================================
// 這個檔案是「網頁 portal」的骨架，純 HTML/CSS/JS，沒有用任何框架。
//
// 1. callDialogueModel(text)  → 已接上後端 /api/chat（見 server.py，
//    用 llama.cpp 跑 Qwen2.5-1.5B-Instruct）
// 2. 表情：原本的 SVG 假臉與關鍵字判別已移除，之後由 BERT 的情緒結果驅動
// 3. avatar 畫面：JoyGen 每句輸出一支 mp4，算完後由 avatar_video 訊息帶
//    URL 過來，接在靜態照片的位置播（不走 WebRTC，見 M3 紀錄）
// ============================================================

const transcriptBody = document.getElementById('transcript-body');
const textInput = document.getElementById('text-input');
const sendBtn = document.getElementById('send-btn');
const avatarStage = document.getElementById('avatar-stage');
const avatarFrame = document.getElementById('avatar-frame');
const avatarVideo = document.getElementById('avatar-video');
const avatarStill = document.getElementById('avatar-still');
const avatarBadge = document.getElementById('avatar-badge');
const facePicker = document.getElementById('face-picker');
const faceSwitch = document.getElementById('face-switch');
const micBtn = document.getElementById('mic-btn');
const micTag = document.getElementById('mic-tag');
const micMeterBar = document.getElementById('mic-meter-bar');
const sampleBtn = document.getElementById('sample-btn');
const statusPill = document.getElementById('status-pill');
const statusText = document.getElementById('status-text');

// 頂端狀態膠囊：state = 'listening' | 'busy' | null
function setStatus(text, state) {
  statusText.textContent = text;
  statusPill.classList.remove('state-listening', 'state-busy');
  if (state) statusPill.classList.add('state-' + state);
}

// 回到閒置狀態：麥克風開著就是「聆聽中」，否則「文字輸入模式」
function resetStatus() {
  if (micStream) setStatus('🎤 聆聽中', 'listening');
  else setStatus('文字輸入模式', null);
}

// ============================================================
// 選臉 + avatar 畫面
//
// 選哪張臉就決定用哪個聲音（一個連線一種），所以左側沒有另外的聲音選項。
// 換臉要重新連一次 /ws/audio，因為 voice 是接在 query 上的。
//
// 流程中畫面一直是靜態照片；JoyGen 把整句算完之後，server.py 會送一個
// avatar_video 訊息過來，那時才把影片接到同一個位置播。
// ============================================================
let selectedAvatar = 'female';
let selectedVoice = 'female';

const FACE_STILLS = {
  female: 'demo-assets/face_female.jpg',
  // male: 待人選定後補上
};

function pickFace(avatarId) {
  selectedAvatar = avatarId;
  selectedVoice = avatarId;          // 選臉就是選聲音
  avatarStill.src = FACE_STILLS[avatarId] || FACE_STILLS.female;
  facePicker.querySelectorAll('.face-card').forEach((card) => {
    card.classList.toggle('selected', card.dataset.avatar === avatarId);
  });
  avatarStage.classList.add('picked');
  showStill();
  if (micBtn.classList.contains('recording')) {
    setStatus('已換臉，停止再重新啟用語音輸入才會生效', null);
  }
}

facePicker.addEventListener('click', (e) => {
  const card = e.target.closest('.face-card');
  if (!card || card.disabled) return;
  pickFace(card.dataset.avatar);
});

faceSwitch.addEventListener('click', () => {
  avatarStage.classList.remove('picked');
  showStill();
});

// 回到靜態照片（每一句的開頭、影片播完之後）
function showStill() {
  avatarFrame.classList.remove('video-active');
  avatarVideo.pause();
  avatarVideo.removeAttribute('src');
  avatarVideo.load();
  avatarBadge.classList.remove('on');
}

function setAvatarBadge(text) {
  if (!text) { avatarBadge.classList.remove('on'); return; }
  avatarBadge.textContent = text;
  avatarBadge.classList.add('on');
}

// 影片與語音都要在「使用者按下按鈕」的那一刻先解鎖，否則幾十秒後才拿到的
// 影片會被瀏覽器的自動播放政策擋掉（Chrome 只認使用者互動過的頁面，而且
// <video> 元素要自己被播過一次才算數）。
// 送出語音的入口（範例語音、啟用麥克風）都會先呼叫這個。
function primeMedia() {
  // AudioContext 一定要在使用者手勢裡建立/恢復，否則之後 Web Audio 出不了聲。
  // 這條路徑是「影片被擋掉時」的備援，所以它必須是可靠的那一個。
  if (!ttsAudioCtx) {
    ttsAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    ttsNextPlayTime = ttsAudioCtx.currentTime;
  }
  if (ttsAudioCtx.state === 'suspended') ttsAudioCtx.resume().catch(() => {});

  // 注意：這裡**不**去預播 <video>。那時候它還沒有 src，play() 必定失敗，
  // 等於什麼都沒解鎖。影片能不能帶聲音自動播，取決於瀏覽器認不認這個網域
  // 的使用者互動——認就直接播，不認就走上面那條 Web Audio 備援。
}

// JoyGen 算完了：把影片接到照片的位置播出來，聲音跟著影片走。
//
// 萬一瀏覽器仍然擋下帶聲音的播放，不要留一個「點我播放」的死路——改成
// 靜音播影片 + 用 Web Audio 播**同一份** PCM（那條路徑在 primeMedia 就解鎖
// 了）。兩者同時開始，所以嘴型跟聲音還是對得上。
function playAvatarVideo(url) {
  cancelAudioFallbackTimer();
  const chunks = pendingAudioChunks;
  pendingAudioChunks = [];

  avatarVideo.src = url;
  avatarVideo.muted = false;
  avatarFrame.classList.add('video-active');
  setAvatarBadge('avatar 回覆中');

  const started = avatarVideo.play();
  if (started && started.catch) {
    started.catch((err) => {
      console.warn('[avatar] 帶聲音播放被擋，改成靜音影片 + Web Audio 語音', err);
      avatarVideo.muted = true;
      avatarVideo.play().catch(() => {});
      playChunks(chunks);
    });
  }

  avatarVideo.onended = () => { showStill(); resetStatus(); };
}

// --- 真正的對話模型：呼叫後端 /api/chat/stream（SSE） ---
// 後端見 server.py，用 llama.cpp 跑 Qwen2.5-1.5B-Instruct，逐字 stream 回傳。
// EventSource 不能發 POST，所以自己用 fetch + ReadableStream 解析
// "data: {...}\n\n" 格式。若連線失敗，改呼叫非 streaming 版 /api/chat 當備援。
const CHAT_STREAM_URL = 'http://localhost:8000/api/chat/stream';
const CHAT_API_URL = 'http://localhost:8000/api/chat';

async function callDialogueModelStream(text, onDelta) {
  const res = await fetch(CHAT_STREAM_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: text }),
  });
  if (!res.ok || !res.body) {
    throw new Error(`後端回應錯誤：${res.status}`);
  }

  const reader = res.body.getReader();
  const decoder = new TextDecoder('utf-8');
  let buffer = '';
  let full = '';

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });

    // SSE 事件用 "\n\n" 分隔
    const events = buffer.split('\n\n');
    buffer = events.pop(); // 最後一段可能不完整，留到下一輪
    for (const evt of events) {
      const line = evt.trim();
      if (!line.startsWith('data:')) continue;
      const payload = JSON.parse(line.slice(5).trim());
      if (payload.delta) {
        full += payload.delta;
        onDelta(payload.delta, full);
      }
    }
  }
  return full;
}

// 非 streaming 備援（stream 端點連不上時使用）
async function callDialogueModelFallback(text) {
  const res = await fetch(CHAT_API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: text }),
  });
  if (!res.ok) throw new Error(`後端回應錯誤：${res.status}`);
  const data = await res.json();
  return data.reply;
}

function appendMessage(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = `<span class="tag">${role === 'user' ? '你' : 'avatar'}</span><span class="body"></span>`;
  div.querySelector('.body').textContent = text;
  transcriptBody.appendChild(div);
  transcriptBody.scrollTop = transcriptBody.scrollHeight;
  return div;
}

async function handleSend() {
  const text = textInput.value.trim();
  if (!text) return;
  textInput.value = '';
  sendBtn.disabled = true;

  appendMessage('user', text);

  avatarFrame.classList.add('speaking');
  setStatus('回覆中…', 'busy');
  const avatarDiv = appendMessage('avatar', '');
  const bodyEl = avatarDiv.querySelector('.body');

  try {
    await callDialogueModelStream(text, (_delta, full) => {
      bodyEl.textContent = full;
      transcriptBody.scrollTop = transcriptBody.scrollHeight;
    });
  } catch (err) {
    console.error('streaming 失敗，改用非 streaming 備援：', err);
    try {
      bodyEl.textContent = await callDialogueModelFallback(text);
    } catch (err2) {
      console.error('callDialogueModelFallback 也失敗：', err2);
      bodyEl.textContent = '（無法連線到對話模型後端，請確認 server.py 是否已啟動）';
    }
  }

  avatarFrame.classList.remove('speaking');
  resetStatus();
  sendBtn.disabled = false;
  textInput.focus();
}

sendBtn.addEventListener('click', handleSend);
textInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') handleSend();
});

// ============================================================
// Voice-only 輸入路徑
//
// 用 AudioWorklet 把麥克風原生取樣率（通常 48kHz）即時 downsample 成
// 16kHz / mono / 16-bit PCM，每 320ms 送一個 chunk，透過 WebSocket
// 傳給後端 /ws/audio。
//
// 後端（server.py /ws/audio）：累積 chunk → VAD 斷句 → faster-whisper
// 辨識 → 丟給 Qwen 產生回覆，逐段串流回來。訊息協定見 handleVoiceMessage()。
// 講完一句話 → 看到回覆，跟打字模式共用同一套 appendMessage。
// ============================================================
const AUDIO_WS_URL = 'ws://localhost:8000/ws/audio';

// 聲音與臉都用 query 參數帶：/ws/audio 是純 binary 的收流迴圈，插 text
// frame 進去會讓它拋例外。一個連線一種臉，換臉要重連（見 pickFace）。
function audioWsUrl() {
  return `${AUDIO_WS_URL}?voice=${encodeURIComponent(selectedVoice)}`
       + `&avatar=${encodeURIComponent(selectedAvatar)}`;
}
const PCM_TARGET_SAMPLE_RATE = 16000;
const PCM_CHUNK_MS = 320; // 對齊 JoyGen 8-frame batch @25fps

// 用 Blob URL 內嵌 AudioWorkletProcessor，維持單一 HTML 檔、免額外檔案。
const PCM_WORKLET_SOURCE = `
class PCM16DownsamplerProcessor extends AudioWorkletProcessor {
  constructor(options) {
    super();
    const { targetSampleRate, chunkMs } = options.processorOptions;
    this.inputRate = sampleRate; // AudioWorkletGlobalScope 提供的 context 取樣率
    this.step = this.inputRate / targetSampleRate;
    this.chunkSamples = Math.round(targetSampleRate * chunkMs / 1000);
    this.outBuffer = new Int16Array(this.chunkSamples);
    this.outIndex = 0;
    this.pos = 0; // 對輸入 channel 的浮點取樣位置（線性插值 downsample 用）
  }

  process(inputs) {
    const channel = inputs[0] && inputs[0][0];
    if (!channel || channel.length === 0) return true;

    let pos = this.pos;
    while (pos < channel.length) {
      const idx = Math.floor(pos);
      const frac = pos - idx;
      const s0 = channel[idx] || 0;
      const s1 = channel[idx + 1] !== undefined ? channel[idx + 1] : s0;
      const sample = Math.max(-1, Math.min(1, s0 + (s1 - s0) * frac));
      this.outBuffer[this.outIndex++] = sample < 0 ? sample * 0x8000 : sample * 0x7fff;

      if (this.outIndex >= this.chunkSamples) {
        const chunk = this.outBuffer.slice(0);
        this.port.postMessage(chunk.buffer, [chunk.buffer]);
        this.outIndex = 0;
      }
      pos += this.step;
    }
    this.pos = pos - channel.length;
    return true;
  }
}
registerProcessor('pcm16-downsampler', PCM16DownsamplerProcessor);
`;

let micStream = null;
let micAudioCtx = null;
let micAnalyser = null;
let micSourceNode = null;
let micWorkletNode = null;
let micSilentGain = null;
let micRafId = null;
let audioSocket = null;

// TTS 回覆語音播放用（跟收音的 micAudioCtx 分開，互不干擾）。
// ttsNextPlayTime 是排程游標：每個 audio_delta 到達的時間點會抖動（網路、
// 合成速度不均），用這個游標依序接龍排程播放，才不會卡頓或疊音。
let ttsAudioCtx = null;
let ttsNextPlayTime = 0;

// CosyVoice 在純 CPU 環境合成速度比即時播放慢很多（RTF 實測約 4 倍），
// 邊合成邊播會播到一半沒有下一塊可接、聲音斷斷續續。改成收滿整段
// audio_delta、等 audio_done 才一次排程播放，犧牲一點「即時感」換取
// 播放連貫（見 docs/tts-prototype-notes.md）。
let pendingAudioChunks = [];

// 聲音預設跟著 JoyGen 的影片一起播（音畫同步）。但 JoyGen 可能沒開、掛掉，
// 或一句話算太久 —— 那種情況下使用者不該完全聽不到回覆，所以逾時就退回
// 單獨播語音。時間抓得寬，因為生成本來就慢（實測一句 11 秒的話要 41 秒）。
const AUDIO_FALLBACK_MS = 120000;
let audioFallbackTimer = null;

// 一次把整段排進去播。每次都從「現在」重新起算排程游標，不然上一句留下的
// ttsNextPlayTime 會讓這一句被排到很久以後才響。
function playChunks(chunks) {
  if (!chunks || !chunks.length) return;
  if (ttsAudioCtx) {
    if (ttsAudioCtx.state === 'suspended') ttsAudioCtx.resume().catch(() => {});
    ttsNextPlayTime = ttsAudioCtx.currentTime;
  }
  for (const chunk of chunks) {
    playAudioChunk(chunk.audio, chunk.sample_rate);
  }
}

function startAudioFallback() {
  cancelAudioFallbackTimer();
  audioFallbackTimer = setTimeout(() => {
    audioFallbackTimer = null;
    if (!pendingAudioChunks.length) return;
    console.warn('[avatar] 等不到 JoyGen 影片，改為只播語音');
    setAvatarBadge('畫面逾時，僅播放語音');
    playChunks(pendingAudioChunks);
    pendingAudioChunks = [];
    resetStatus();
  }, AUDIO_FALLBACK_MS);
}

function cancelAudioFallbackTimer() {
  if (audioFallbackTimer) {
    clearTimeout(audioFallbackTimer);
    audioFallbackTimer = null;
  }
}

function playAudioChunk(base64, sampleRate) {
  if (!ttsAudioCtx) {
    ttsAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    ttsNextPlayTime = ttsAudioCtx.currentTime;
  }

  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  const pcm16 = new Int16Array(bytes.buffer);

  const float32 = new Float32Array(pcm16.length);
  for (let i = 0; i < pcm16.length; i++) float32[i] = pcm16[i] / 32768;

  const buffer = ttsAudioCtx.createBuffer(1, float32.length, sampleRate);
  buffer.copyToChannel(float32, 0);

  const source = ttsAudioCtx.createBufferSource();
  source.buffer = buffer;
  source.connect(ttsAudioCtx.destination);

  const startAt = Math.max(ttsAudioCtx.currentTime, ttsNextPlayTime);
  source.start(startAt);
  ttsNextPlayTime = startAt + buffer.duration;
}

function connectAudioSocket() {
  const socket = new WebSocket(audioWsUrl());
  socket.binaryType = 'arraybuffer';
  socket.onopen = () => console.log('[voice] /ws/audio 連線成功');
  socket.onerror = (err) => console.error('[voice] /ws/audio 連線錯誤：', err);
  socket.onclose = () => console.log('[voice] /ws/audio 連線關閉');
  socket.onmessage = (evt) => {
    let msg;
    try { msg = JSON.parse(evt.data); } catch (e) { return; }
    handleVoiceMessage(msg);
  };
  return socket;
}

// 目前正在串流的 avatar 回覆（voice 模式），跟打字模式的 avatarDiv 分開管理
let voiceReplyBodyEl = null;
let voiceReplyFull = '';

// /ws/audio 回傳訊息的處理。訊息型別見 server.py 的 audio_stream() docstring：
//   ack / asr_start / transcript / reply_delta / reply_done / audio_delta /
//   audio_done / asr_empty / error
function handleVoiceMessage(msg) {
  switch (msg.type) {
    case 'ack':
      // 每個 chunk 一個，收音狀態已由音量條反映，這裡不用處理
      break;

    case 'asr_start':
      setStatus('辨識中…', 'busy');
      break;

    case 'asr_empty':
      // 有聲音但辨識不出內容（雜音、太小聲），安靜回到聆聽狀態
      resetStatus();
      break;

    case 'transcript':
      appendMessage('user', msg.text);
      // avatar 回覆的泡泡等 reply_delta 才建：後端辨識完可能還在等使用者把
      // 話講完（coalesce window），這段時間可能再來一個 transcript。
      voiceReplyFull = '';
      voiceReplyBodyEl = null;
      pendingAudioChunks = [];
      setStatus('回覆中…', 'busy');
      break;

    case 'reply_delta':
      if (!voiceReplyBodyEl) {
        avatarFrame.classList.add('speaking');
        voiceReplyFull = '';
        voiceReplyBodyEl = appendMessage('avatar', '').querySelector('.body');
        setStatus('回覆中…', 'busy');
      }
      voiceReplyFull += msg.delta;
      voiceReplyBodyEl.textContent = voiceReplyFull;
      transcriptBody.scrollTop = transcriptBody.scrollHeight;
      break;

    case 'reply_done':
      // 表情已在 transcript 進來時依使用者的話設好（跟打字模式一致，
      // 避免這裡用中性的回覆內容把它蓋回 calm）
      voiceReplyBodyEl = null;
      voiceReplyFull = '';
      avatarFrame.classList.remove('speaking');
      resetStatus();
      break;

    case 'audio_delta':
      // 先收著、不馬上播——見上面 pendingAudioChunks 宣告處的說明。
      pendingAudioChunks.push(msg);
      break;

    case 'audio_done':
      // 語音全到了，但**先不播** —— 影片本身含聲音，等 JoyGen 算完一起播才
      // 會音畫同步（不然使用者會先聽到回覆、幾十秒後再看到嘴型動）。
      //
      // 保險：JoyGen 沒開、掛掉或算太久時不能讓使用者什麼都聽不到，
      // 所以設一個計時器，逾時就退回單獨播語音。
      setStatus('生成 avatar 畫面中…', 'busy');
      setAvatarBadge('生成畫面中…');
      startAudioFallback();
      break;

    case 'avatar_video':
      // JoyGen 算完了：影片接到照片的位置，聲音跟著影片走。
      console.log('[avatar]', msg.url, msg.frames, '張,',
                  Math.round((msg.generate_ms || 0) / 1000), '秒');
      playAvatarVideo(msg.url);
      setStatus('avatar 回覆中', 'busy');
      break;

    case 'error':
      console.warn('[voice] 後端錯誤：', msg.error);
      voiceReplyBodyEl = null;
      voiceReplyFull = '';
      avatarFrame.classList.remove('speaking');
      resetStatus();
      break;
  }
}

async function enableMic() {
  primeMedia();   // 同上：趁使用者點擊時解鎖
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) {
    console.error('取得麥克風權限失敗：', err);
    // err.name 能分辨真正原因：NotAllowedError（網站或系統層級權限被拒）、
    // NotFoundError（沒偵測到麥克風裝置）、SecurityError（不是安全情境，
    // 例如用 file:// 打開）等，直接顯示出來比一律說「被拒絕」好排查。
    micTag.textContent = `錯誤：${err.name}`;
    setStatus(`麥克風權限失敗（${err.name}）`, null);
    return;
  }

  micAudioCtx = new (window.AudioContext || window.webkitAudioContext)();

  // 音量條沿用原本的 analyser（跟 downsample pipeline 平行、互不影響）
  micSourceNode = micAudioCtx.createMediaStreamSource(micStream);
  micAnalyser = micAudioCtx.createAnalyser();
  micAnalyser.fftSize = 256;
  micSourceNode.connect(micAnalyser);

  try {
    const workletBlob = new Blob([PCM_WORKLET_SOURCE], { type: 'application/javascript' });
    const workletURL = URL.createObjectURL(workletBlob);
    await micAudioCtx.audioWorklet.addModule(workletURL);
    URL.revokeObjectURL(workletURL);

    micWorkletNode = new AudioWorkletNode(micAudioCtx, 'pcm16-downsampler', {
      processorOptions: { targetSampleRate: PCM_TARGET_SAMPLE_RATE, chunkMs: PCM_CHUNK_MS },
    });
    micSourceNode.connect(micWorkletNode);

    // AudioWorkletNode 不接 destination 的話，部分瀏覽器會停止呼叫 process()，
    // 所以接一個音量為 0 的 GainNode 當終點，避免真的有聲音跑到喇叭造成回授。
    micSilentGain = micAudioCtx.createGain();
    micSilentGain.gain.value = 0;
    micWorkletNode.connect(micSilentGain);
    micSilentGain.connect(micAudioCtx.destination);

    audioSocket = connectAudioSocket();
    micWorkletNode.port.onmessage = (evt) => {
      if (audioSocket && audioSocket.readyState === WebSocket.OPEN) {
        audioSocket.send(evt.data);
      }
    };
  } catch (err) {
    console.error('AudioWorklet 初始化失敗，voice-only pipeline 未啟用：', err);
  }

  micBtn.textContent = '⏹ 停止語音輸入';
  micBtn.classList.add('recording');
  micTag.textContent = 'voice-only 已啟用';
  micTag.classList.add('on');
  sampleBtn.disabled = true;
  setStatus('🎤 聆聽中', 'listening');

  drawMicLevel();
}

function drawMicLevel() {
  const data = new Uint8Array(micAnalyser.frequencyBinCount);
  micAnalyser.getByteFrequencyData(data);
  const avg = data.reduce((a, b) => a + b, 0) / data.length;
  micMeterBar.style.width = Math.min(100, (avg / 128) * 100) + '%';
  micRafId = requestAnimationFrame(drawMicLevel);
}

function disableMic() {
  if (micRafId) cancelAnimationFrame(micRafId);
  if (micWorkletNode) {
    micWorkletNode.port.onmessage = null;
    micWorkletNode.disconnect();
  }
  if (micSilentGain) micSilentGain.disconnect();
  if (micSourceNode) micSourceNode.disconnect();
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  if (audioSocket) audioSocket.close();
  if (micAudioCtx) micAudioCtx.close();

  micStream = null;
  micAudioCtx = null;
  micAnalyser = null;
  micSourceNode = null;
  micWorkletNode = null;
  micSilentGain = null;
  audioSocket = null;
  micMeterBar.style.width = '0%';

  micBtn.textContent = '🎤 啟用語音輸入（voice-only）';
  micBtn.classList.remove('recording');
  micTag.textContent = '尚未啟用';
  micTag.classList.remove('on');
  sampleBtn.disabled = false;
  voiceReplyBodyEl = null;
  voiceReplyFull = '';
  avatarFrame.classList.remove('speaking');
  setStatus('文字輸入模式', null);
}

micBtn.addEventListener('click', () => {
  if (micStream) {
    disableMic();
  } else {
    enableMic();
  }
});

// ============================================================
// 「播放範例語音」—— demo 用，不需麥克風。
//
// 讀一個內建的 16kHz/mono/16-bit PCM wav，前後墊靜音，以真實時間速率
// (每 320ms 一個 chunk) 送進跟麥克風完全一樣的 /ws/audio pipeline，
// 回來的 transcript / reply 由 handleVoiceMessage() 顯示在頁面上。
// ============================================================
const SAMPLE_WAV_URL = 'demo-assets/sample-zh.wav';
let samplePlaying = false;

async function loadWavPcm(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`載入 ${url} 失敗：${res.status}`);
  const buf = await res.arrayBuffer();
  const dv = new DataView(buf);
  if (String.fromCharCode(dv.getUint8(0), dv.getUint8(1), dv.getUint8(2), dv.getUint8(3)) !== 'RIFF') {
    throw new Error('不是 WAV 檔');
  }
  let off = 12;
  while (off + 8 <= dv.byteLength) {
    const id = String.fromCharCode(dv.getUint8(off), dv.getUint8(off + 1), dv.getUint8(off + 2), dv.getUint8(off + 3));
    const size = dv.getUint32(off + 4, true);
    if (id === 'data') return new Uint8Array(buf, off + 8, size);
    off += 8 + size + (size & 1);
  }
  throw new Error('WAV 裡找不到 data chunk');
}

function endSamplePlayback() {
  samplePlaying = false;
  sampleBtn.disabled = false;
  sampleBtn.classList.remove('playing');
  sampleBtn.textContent = '🔊 播放範例語音';
  if (!micStream) micBtn.disabled = false;
  if (!voiceReplyBodyEl) resetStatus();
}

async function playSample() {
  if (samplePlaying || micStream) return;
  // 這裡還在使用者點擊的當下，是唯一能解鎖音訊與影片播放的時機
  primeMedia();
  samplePlaying = true;
  sampleBtn.disabled = true;
  sampleBtn.classList.add('playing');
  sampleBtn.textContent = '⏳ 播放中…';
  micBtn.disabled = true;
  setStatus('播放範例語音…', 'busy');

  let pcm;
  try {
    pcm = await loadWavPcm(SAMPLE_WAV_URL);
  } catch (err) {
    console.error('[sample]', err);
    setStatus('範例語音載入失敗', null);
    endSamplePlayback();
    return;
  }

  // 前墊 600ms 靜音（校正）、後墊 1600ms（讓 VAD 判定句尾）
  const bytesFor = (ms) => Math.round(PCM_TARGET_SAMPLE_RATE * ms / 1000) * 2;
  const chunkBytes = bytesFor(PCM_CHUNK_MS);
  const stream = new Uint8Array(bytesFor(600) + pcm.length + bytesFor(1600));
  stream.set(pcm, bytesFor(600));

  const ws = new WebSocket(audioWsUrl());
  ws.binaryType = 'arraybuffer';
  let replyDoneAt = null;
  // reply_done 之後 server 還會接著送 TTS 的 audio_delta/audio_done（見
  // server.py 的 _stream_tts_to_ws），不能在 reply_done 就關掉連線，不然
  // 語音還沒送到就被切斷了。改成等 audio_done/error，並加一個保險 timeout
  // ——如果後端 TTS_ENABLED=False 或卡住，reply_done 之後不會再有任何
  // 訊息，避免連線和 UI 卡住不會結束。
  // audio_done 之後還會有 avatar_video（server.py 要等 JoyGen 把整句畫完才
  // 送），所以不能在 audio_done 就關連線，不然影片永遠收不到。改成等
  // avatar_video；JoyGen 沒開或算太久時，由下面的計時器收尾。
  const FALLBACK_CLOSE_MS = 150000;
  let audioDoneAt = null;
  ws.onmessage = (evt) => {
    let msg;
    try { msg = JSON.parse(evt.data); } catch (e) { return; }
    handleVoiceMessage(msg);
    if (msg.type === 'reply_done') {
      replyDoneAt = Date.now();
    }
    if (msg.type === 'audio_done') {
      audioDoneAt = Date.now();
    }
    if (msg.type === 'avatar_video' || msg.type === 'error') {
      clearInterval(fallbackTimer);
      ws.close();
      endSamplePlayback();
    }
  };
  const fallbackTimer = setInterval(() => {
    const since = audioDoneAt || replyDoneAt;
    if (since && Date.now() - since >= FALLBACK_CLOSE_MS) {
      clearInterval(fallbackTimer);
      ws.close();
      endSamplePlayback();
    }
  }, 1000);
  ws.onerror = () => {
    clearInterval(fallbackTimer);
    setStatus('連不上後端 /ws/audio', null);
    endSamplePlayback();
  };

  const opened = await new Promise((res) => {
    ws.onopen = () => res(true);
    setTimeout(() => res(false), 4000);
  });
  if (!opened) {
    console.error('[sample] /ws/audio 連線逾時，後端有開嗎？');
    setStatus('連不上後端', null);
    try { ws.close(); } catch (e) {}
    endSamplePlayback();
    return;
  }

  let idx = 0;
  const timer = setInterval(() => {
    if (ws.readyState !== WebSocket.OPEN) { clearInterval(timer); return; }
    const end = Math.min(idx + chunkBytes, stream.length);
    ws.send(stream.slice(idx, end).buffer);
    idx = end;
    if (idx >= stream.length) clearInterval(timer);
  }, PCM_CHUNK_MS);
}

sampleBtn.addEventListener('click', playSample);
</script>
